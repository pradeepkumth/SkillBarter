# Netlify Configuration for SkillBarter Vite + React SPA
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) routing
# Ensures refreshing pages or deep links route through index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache immutable Vite hashed assets for ultra-fast performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
